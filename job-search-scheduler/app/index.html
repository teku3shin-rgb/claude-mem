<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3c88">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="就活手帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<script>window.__PWA__ = true;</script>
</head>
<body>
<title>就活スケジュール帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Old+Mincho:wght@700&display=swap">
<style>
/* Layout: 手帳のような一枚。上に今日と要注意の数字、下にタブで「予定 / カレンダー / 企業」を切り替える */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --surface-2: #f7f8fb;
  --ink: #17223a;
  --muted: #5c6679;
  --line: #d8dde6;
  --accent: #1f3c88;
  --accent-ink: #ffffff;
  --accent-soft: #e3e9f6;
  --danger: #b2382e;
  --danger-soft: #f8e5e2;
  --warn: #9a6400;
  --warn-soft: #f6ecd8;
  --ok: #2c7650;
  --ok-soft: #e0f0e6;
  --gold: #8f6f1f;
  --gold-soft: #f3ead2;
  --font-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141e; --surface: #161e2b; --surface-2: #1b2433; --ink: #e5e9f1; --muted: #9ba5b7; --line: #2a3445;
    --accent: #93acee; --accent-ink: #0e141e; --accent-soft: #1f2b47;
    --danger: #ef8478; --danger-soft: #3a1f1e; --warn: #e3ac4b; --warn-soft: #362a14;
    --ok: #74c597; --ok-soft: #173024; --gold: #d8bb6c; --gold-soft: #332c17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141e; --surface: #161e2b; --surface-2: #1b2433; --ink: #e5e9f1; --muted: #9ba5b7; --line: #2a3445;
  --accent: #93acee; --accent-ink: #0e141e; --accent-soft: #1f2b47;
  --danger: #ef8478; --danger-soft: #3a1f1e; --warn: #e3ac4b; --warn-soft: #362a14;
  --ok: #74c597; --ok-soft: #173024; --gold: #d8bb6c; --gold-soft: #332c17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; gap: 20px; }
button, select, input, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
header.top h1 { font-family: var(--font-display); font-size: 1.9rem; line-height: 1.2; margin: 0; letter-spacing: .04em; text-wrap: balance; }
header.top .today { color: var(--muted); margin: 4px 0 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.small { padding: 3px 10px; font-size: .85rem; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.notice { font-size: .85rem; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; }
.stat .label { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
.stat .value { font-size: 1.8rem; font-weight: 700; line-height: 1.2; }
.stat .value small { font-size: .85rem; font-weight: 400; color: var(--muted); margin-left: 2px; }
.stat.alert .value { color: var(--danger); }
.stat.good .value { color: var(--gold); }
.stat .hint { font-size: .78rem; color: var(--muted); min-height: 1.2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 14px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .9rem; cursor: pointer; }

/* 予定リスト */
.day { display: grid; gap: 8px; }
.day h3 { margin: 0; display: flex; align-items: baseline; gap: 10px; font-family: var(--font-display); font-size: 1.1rem; }
.day h3 .wd { font-family: var(--font-body); font-weight: 400; font-size: .9rem; color: var(--muted); }
.pill { font-family: var(--font-body); font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.today { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.pill.soon { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.over { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.list { display: grid; gap: 20px; }
.item { display: grid; grid-template-columns: auto 92px minmax(0, 1fr) auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.item.done { opacity: .55; }
.item.done .ttl { text-decoration: line-through; }
.item input[type="checkbox"] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); cursor: pointer; }
.item .when { display: grid; gap: 4px; justify-items: start; }
.item .time { font-weight: 700; }
.item .main { min-width: 0; display: grid; gap: 2px; }
.item .co { font-size: .82rem; color: var(--muted); }
.item .ttl { font-weight: 700; overflow-wrap: anywhere; }
.item .meta { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
.item .meta a { color: var(--accent); }
.item .ops { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.kind { font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 4px; white-space: nowrap; }
.k-deadline { background: var(--danger-soft); color: var(--danger); }
.k-interview { background: var(--accent-soft); color: var(--accent); }
.k-test { background: var(--warn-soft); color: var(--warn); }
.k-seminar { background: var(--ok-soft); color: var(--ok); }
.k-other { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
@media (max-width: 620px) {
  .item { grid-template-columns: auto minmax(0, 1fr); }
  .item .when { grid-column: 2; display: flex; gap: 8px; align-items: center; }
  .item .main { grid-column: 2; }
  .item .ops { grid-column: 2; justify-content: flex-start; }
}

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px 20px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty strong { color: var(--ink); }

/* カレンダー */
.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cal-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.3rem; min-width: 8.5em; }
.cal-scroll { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.cal .dow { font-size: .78rem; text-align: center; padding: 4px 0; color: var(--muted); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.cal .dow.sun, .cal .cell.sun .d { color: var(--danger); }
.cal .dow.sat, .cal .cell.sat .d { color: var(--accent); }
.cell { min-height: 92px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; background: none; border-top: 0; border-left: 0; text-align: left; min-width: 0; }
.cell:hover { background: var(--surface-2); }
.cell.out { opacity: .4; }
.cell.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.cell .d { font-size: .82rem; font-weight: 700; }
.cell.is-today .d { background: var(--danger); color: var(--surface) !important; border-radius: 999px; padding: 0 7px; align-self: flex-start; }
.cell .ev { font-size: .72rem; line-height: 1.35; padding: 0 4px; border-radius: 3px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cell .more { font-size: .7rem; color: var(--muted); }
@media (max-width: 620px) {
  .cell { min-height: 58px; }
  .cell .ev { font-size: 0; height: 5px; padding: 0; }
  .cell .more { font-size: .65rem; }
}
.legend { display: flex; flex-wrap: wrap; gap: 8px; }

/* 企業 */
.pipeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
.stage-chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; cursor: pointer; text-align: left; display: grid; }
.stage-chip .n { font-size: 1.3rem; font-weight: 700; line-height: 1.2; }
.stage-chip .s { font-size: .74rem; color: var(--muted); }
.stage-chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stage-chip.offer .n { color: var(--gold); }
.stage-group { display: grid; gap: 10px; }
.stage-group h3 { margin: 0; font-size: .95rem; display: flex; gap: 8px; align-items: center; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card .name { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.card .ind { font-size: .82rem; color: var(--muted); }
.prio { font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; white-space: nowrap; }
.prio-3 { background: var(--danger-soft); color: var(--danger); }
.prio-2 { background: var(--accent-soft); color: var(--accent); }
.prio-1 { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.card .next { font-size: .85rem; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; }
.card .next.none { color: var(--muted); }
.card .memo { font-size: .85rem; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.card .ops { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card select { border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--surface); font-size: .85rem; }
.card a { color: var(--accent); font-size: .85rem; }

/* ダイアログ */
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 0; width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(10 15 25 / .45); }
dialog form { display: grid; gap: 12px; padding: 20px; }
dialog h2 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; }
.field { display: grid; gap: 4px; }
.field > span { font-size: .82rem; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--surface-2); width: 100%; }
.field textarea { min-height: 72px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.dlg-ops { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
.dlg-ops .right { display: flex; gap: 8px; margin-left: auto; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; }

/* メール取り込み */
#dlg-mail { width: min(720px, calc(100vw - 32px)); }
.mail-controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.mail-controls .field { min-width: 120px; }
.mail-paste summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
.mail-paste[open] { display: grid; gap: 8px; }
.mail-paste textarea { min-height: 140px; width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface-2); resize: vertical; }
.cand { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; }
.cand input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); }
.cand .body { display: grid; gap: 3px; min-width: 0; }
.cand .top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cand .ttl { font-weight: 700; overflow-wrap: anywhere; }
.cand .meta, .cand .src { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
.cand .src a { color: var(--accent); }
.cand .warn { font-size: .8rem; color: var(--warn); font-weight: 700; }
.mail-group { display: grid; gap: 8px; }
.mail-group h3 { margin: 0; font-size: .92rem; }

/* バックアップ */
.backup { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 20px; }
.backup h2 { margin: 0; font-size: 1rem; }
.backup p { margin: 0; color: var(--muted); font-size: .88rem; max-width: 65ch; }
.backup label.btn { display: inline-block; }

/* 詳細表示・ゴミ箱 */
.item[data-action], .card[data-action] { cursor: pointer; }
.item[data-action]:hover, .card[data-action]:hover { border-color: var(--accent); }
button.stat { font: inherit; color: inherit; text-align: left; cursor: pointer; }
button.stat:hover { border-color: var(--accent); }
.icon-btn { border: 1px solid transparent; background: none; border-radius: 6px; padding: 4px 6px; color: var(--muted); cursor: pointer; display: inline-grid; place-items: center; }
.btn svg { vertical-align: -3px; }
.icon-btn:hover { color: var(--danger); border-color: var(--line); background: var(--danger-soft); }
.detail { display: grid; gap: 14px; padding: 20px; }
.detail .head { display: grid; gap: 4px; }
.detail .head .sub { color: var(--muted); font-size: .88rem; }
.detail dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; margin: 0; }
.detail dt { color: var(--muted); font-size: .82rem; padding-top: 2px; white-space: nowrap; }
.detail dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.detail dd a { color: var(--accent); }
.detail .sec { display: grid; gap: 8px; }
.detail .sec h3 { margin: 0; font-size: .95rem; }
.detail .item { grid-template-columns: auto minmax(0, 1fr); }
.detail .item .when { grid-column: 2; display: flex; gap: 8px; align-items: center; }
.detail .item .main, .detail .item .ops { grid-column: 2; }
.detail .item .ops { justify-content: flex-start; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: .9rem; max-width: calc(100vw - 32px); z-index: 10; display: flex; align-items: center; gap: 14px; }
.toast button { background: none; border: 0; color: var(--bg); font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .toast { transition: opacity .2s; }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>就活スケジュール帳</h1>
      <p class="today num" id="today"></p>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="btn-mail" hidden>メールから取り込む</button>
      <button class="btn" type="button" data-action="new-company">＋ 企業を追加</button>
      <button class="btn primary" type="button" data-action="new-event">＋ 予定を追加</button>
    </div>
  </header>

  <p class="notice" id="mode-notice" hidden></p>

  <section class="stats" id="stats" aria-label="サマリー"></section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-upcoming" data-tab="upcoming" aria-selected="true">予定</button>
    <button class="tab" role="tab" id="tab-calendar" data-tab="calendar" aria-selected="false">カレンダー</button>
    <button class="tab" role="tab" id="tab-companies" data-tab="companies" aria-selected="false">企業・選考状況</button>
  </nav>

  <section id="view-upcoming" class="list"></section>
  <section id="view-calendar" class="list" hidden></section>
  <section id="view-companies" class="list" hidden></section>

  <section class="backup" id="backup" hidden>
    <h2>データのバックアップ</h2>
    <p id="backup-text">企業と予定をファイルに保存しておけます。機種変更のときや、別の端末へ移すときは、保存したファイルを「バックアップから読み込む」で取り込んでください。</p>
    <div class="actions">
      <button class="btn" type="button" id="btn-export">バックアップを保存</button>
      <label class="btn" id="lbl-import">バックアップから読み込む<input type="file" id="file-import" accept="application/json,.json" hidden></label>
    </div>
  </section>
</div>

<dialog id="dlg-event">
  <form id="form-event" method="dialog">
    <h2 id="ev-heading">予定を追加</h2>
    <div class="grid2">
      <label class="field"><span>種類</span>
        <select id="ev-kind" name="kind"></select>
      </label>
      <label class="field"><span>企業</span>
        <select id="ev-company" name="companyId"></select>
      </label>
    </div>
    <label class="field"><span>内容 *</span>
      <input id="ev-title" name="title" required maxlength="120" placeholder="例: 一次面接（オンライン）">
    </label>
    <div class="grid2">
      <label class="field"><span>日付 *</span>
        <input id="ev-date" name="date" type="date" required>
      </label>
      <label class="field"><span>時刻（締切なら締切時刻）</span>
        <input id="ev-time" name="time" type="time">
      </label>
    </div>
    <label class="field"><span>場所・URL</span>
      <input id="ev-place" name="place" maxlength="300" placeholder="例: 本社 3F / https://…">
    </label>
    <label class="field"><span>メモ</span>
      <textarea id="ev-memo" name="memo" maxlength="2000" placeholder="持ち物、準備すること、聞きたい質問など"></textarea>
    </label>
    <label class="check"><input id="ev-done" name="done" type="checkbox"> 完了済み</label>
    <div class="dlg-ops">
      <button class="btn danger" type="button" id="ev-delete" hidden>削除</button>
      <div class="right">
        <button class="btn" type="button" data-close>キャンセル</button>
        <button class="btn primary" type="submit">保存</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="dlg-company">
  <form id="form-company" method="dialog">
    <h2 id="co-heading">企業を追加</h2>
    <label class="field"><span>企業名 *</span>
      <input id="co-name" name="name" required maxlength="100">
    </label>
    <div class="grid2">
      <label class="field"><span>業界・職種</span>
        <input id="co-industry" name="industry" maxlength="80" placeholder="例: IT / 総合職">
      </label>
      <label class="field"><span>志望度</span>
        <select id="co-priority" name="priority">
          <option value="3">高</option>
          <option value="2" selected>中</option>
          <option value="1">低</option>
        </select>
      </label>
    </div>
    <label class="field"><span>選考段階</span>
      <select id="co-stage" name="stage"></select>
    </label>
    <label class="field"><span>採用ページ・マイページURL</span>
      <input id="co-url" name="url" type="url" maxlength="500" placeholder="https://">
    </label>
    <label class="field"><span>メモ（志望動機の軸、面接で聞かれたことなど）</span>
      <textarea id="co-memo" name="memo" maxlength="4000"></textarea>
    </label>
    <p class="notice">パスワードはここに保存しないでください。</p>
    <div class="dlg-ops">
      <button class="btn danger" type="button" id="co-delete" hidden>削除</button>
      <div class="right">
        <button class="btn" type="button" data-close>キャンセル</button>
        <button class="btn primary" type="submit">保存</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="dlg-mail" aria-labelledby="mail-title">
  <div class="detail">
    <div class="head">
      <h2 id="mail-title">メールから予定を取り込む</h2>
      <span class="sub">Gmail の就活メールを Claude が読み、日時・企業名・場所を取り出します。追加する前に内容を確認できます。</span>
    </div>
    <div class="mail-controls">
      <label class="field"><span>読む期間</span>
        <select id="mail-range">
          <option value="3">直近3日</option>
          <option value="7" selected>直近7日</option>
          <option value="14">直近14日</option>
          <option value="30">直近30日</option>
        </select>
      </label>
      <div style="display:grid;gap:4px">
        <label class="check"><input type="checkbox" id="mail-invites"> 申し込み前の説明会・イベント案内も表示</label>
        <label class="check"><input type="checkbox" id="mail-rescan"> 前に確認したメールも読み直す</label>
      </div>
      <button class="btn primary" type="button" id="mail-scan">Gmail を確認</button>
    </div>
    <details class="mail-paste">
      <summary>別のアカウントのメールを貼り付けて読み取る</summary>
      <textarea id="mail-paste-text" maxlength="20000" placeholder="件名・差出人・本文をまとめて貼り付けてください"></textarea>
      <div><button class="btn" type="button" id="mail-paste-go">貼り付けたメールを読み取る</button></div>
    </details>
    <p class="notice" id="mail-status" hidden></p>
    <div id="mail-results" class="list"></div>
    <div class="dlg-ops">
      <span class="sub" id="mail-accounts" style="color:var(--muted);font-size:.82rem"></span>
      <div class="right">
        <button class="btn" type="button" data-close>閉じる</button>
        <button class="btn primary" type="button" id="mail-add" hidden>選んだ予定を追加</button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="dlg-detail" aria-labelledby="detail-title">
  <div class="detail" id="detail-body"></div>
</dialog>

<div class="toast" id="toast" role="status" hidden><span id="toast-msg"></span><button type="button" id="toast-undo" hidden>元に戻す</button></div>

<script>
(() => {
  const STAGES = ['気になる', 'エントリー済', 'ES提出済', 'Webテスト', '一次面接', '二次面接', '最終面接', '内定', '辞退・見送り'];
  const ACTIVE = new Set(STAGES.slice(1, 7));
  const KINDS = {
    deadline: { label: '締切', cls: 'k-deadline' },
    seminar: { label: '説明会', cls: 'k-seminar' },
    test: { label: 'テスト', cls: 'k-test' },
    interview: { label: '面接', cls: 'k-interview' },
    other: { label: 'その他', cls: 'k-other' },
  };
  const PRIO = { 3: '志望度 高', 2: '志望度 中', 1: '志望度 低' };
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const LOCAL_KEY = 'job-schedule-v1';
  const TRASH = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';

  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayStr = () => ymd(new Date());
  const daysUntil = s => Math.round((parseDate(s) - parseDate(todayStr())) / 86400000);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isUrl = s => /^https?:\/\/\S+$/i.test(s || '');
  const linkify = s => isUrl(s) ? `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>` : esc(s);

  const now = new Date();
  const state = {
    companies: new Map(),
    events: new Map(),
    mode: 'loading',
    readOnly: false,
    tab: 'upcoming',
    showDone: false,
    month: new Date(now.getFullYear(), now.getMonth(), 1),
    selDate: todayStr(),
    stageFilter: null,
  };
  try { const t = localStorage.getItem('job-schedule-tab'); if (['upcoming', 'calendar', 'companies'].includes(t)) state.tab = t; } catch (e) {}

  /* ---------- 保存先 ---------- */
  let db = null;
  let mcp = null, sampler = null;

  function loadLocal() {
    try {
      const raw = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}');
      state.companies = new Map(Object.entries(raw.companies || {}));
      state.events = new Map(Object.entries(raw.events || {}));
    } catch (e) {}
  }
  function saveLocal() {
    try {
      localStorage.setItem(LOCAL_KEY, JSON.stringify({
        companies: Object.fromEntries(state.companies),
        events: Object.fromEntries(state.events),
      }));
    } catch (e) { toast('この端末に保存できませんでした'); }
  }
  function newId(col) {
    if (db) return db.collection(col).doc().id;
    return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
  }
  function handleWriteError(e) {
    if (e && e.code === 'invalid_argument') { state.readOnly = true; render(); toast('このページを編集する権限がありません'); }
    else if (e && e.code === 'quota_exceeded') toast('保存容量の上限に達しました。古い予定を削除してください');
    else toast('保存できませんでした。時間をおいてもう一度お試しください');
  }
  async function put(col, id, data) {
    if (state.mode === 'db') {
      try { await db.collection(col).doc(id).set(data); return true; } catch (e) { handleWriteError(e); return false; }
    }
    state[col].set(id, data); saveLocal(); render(); return true;
  }
  async function remove(col, id) {
    if (state.mode === 'db') {
      try { await db.collection(col).doc(id).delete(); return true; } catch (e) { handleWriteError(e); return false; }
    }
    state[col].delete(id); saveLocal(); render(); return true;
  }

  async function initStore() {
    try { if (window.claude && window.claude.use) db = await window.claude.use('db'); } catch (e) { db = null; }
    const notice = document.getElementById('mode-notice');
    if (db) {
      state.mode = 'db';
      try {
        const user = await window.claude.use('user');
        const can = user ? await user.can('data.write') : null;
        if (can === false) state.readOnly = true;
      } catch (e) {}
      if (state.readOnly) { notice.textContent = '閲覧のみです。予定や企業の追加・編集はできません。'; notice.hidden = false; }
      const onErr = () => { notice.textContent = 'データの読み込みが止まりました。ページを再読み込みしてください。'; notice.hidden = false; };
      try { mcp = await window.claude.use('mcp'); } catch (e) { mcp = null; }
      try { sampler = await window.claude.use('sample'); } catch (e) { sampler = null; }
      document.getElementById('btn-mail').hidden = !(mcp && sampler) || state.readOnly;
      for (const col of ['companies', 'events']) {
        db.collection(col).onSnapshot(snap => {
          state[col] = new Map(snap.docs.map(d => [d.id, d.data()]));
          render();
        }, onErr);
      }
    } else {
      state.mode = 'local';
      loadLocal();
      notice.textContent = window.__PWA__
        ? 'データはこの端末の中に保存されます。機種変更に備えて、ときどき下の「バックアップを保存」をしておくと安心です。'
        : 'データはこのブラウザの中だけに保存されます。別の端末とは同期されません。';
      notice.hidden = false;
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
      render();
    }
  }

  /* ---------- 共通 ---------- */
  const fmtDay = s => { const d = parseDate(s); return { md: `${d.getMonth() + 1}月${d.getDate()}日`, wd: WD[d.getDay()] }; };
  const fmtShort = s => { const d = parseDate(s); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
  function countdown(s) {
    const n = daysUntil(s);
    if (n === 0) return '<span class="pill today">今日</span>';
    if (n === 1) return '<span class="pill soon">明日</span>';
    if (n < 0) return `<span class="pill over">${-n}日前</span>`;
    return `<span class="pill${n <= 3 ? ' soon' : ''}">あと${n}日</span>`;
  }
  const evSort = (a, b) => (a[1].date + (a[1].time || '00:00')).localeCompare(b[1].date + (b[1].time || '00:00'));
  const coName = id => (state.companies.get(id) || {}).name || '';

  function gcalUrl(ev) {
    const name = coName(ev.companyId);
    const text = `${name ? name + ' ' : ''}${ev.title}`;
    const d0 = parseDate(ev.date);
    const f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
    let dates;
    if (ev.time) {
      const [h, m] = ev.time.split(':').map(Number);
      const s = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate(), h, m);
      const e = new Date(s.getTime() + 3600000);
      const ft = d => `${f(d)}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
      dates = `${ft(s)}/${ft(e)}`;
    } else {
      dates = `${f(d0)}/${f(new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + 1))}`;
    }
    const p = new URLSearchParams({ action: 'TEMPLATE', text, dates, details: ev.memo || '', location: ev.place || '' });
    return 'https://calendar.google.com/calendar/render?' + p.toString();
  }

  function itemHtml(id, ev, opts = {}) {
    const k = KINDS[ev.kind] || KINDS.other;
    const name = coName(ev.companyId);
    const dis = state.readOnly ? ' disabled' : '';
    return `<article class="item${ev.done ? ' done' : ''}" data-action="view-event" data-id="${esc(id)}" tabindex="0" aria-label="${esc((name ? name + ' ' : '') + ev.title)} の詳細を見る">
      <input type="checkbox" aria-label="完了にする" data-action="toggle-done" data-id="${esc(id)}"${ev.done ? ' checked' : ''}${dis}>
      <div class="when"><span class="kind ${k.cls}">${k.label}</span>
        <span class="time num">${opts.showDate ? fmtShort(ev.date) + ' ' : ''}${ev.time ? esc(ev.time) : (ev.kind === 'deadline' ? '終日' : '時間未定')}</span></div>
      <div class="main">
        ${name ? `<span class="co">${esc(name)}</span>` : ''}
        <span class="ttl">${esc(ev.title)}</span>
        ${ev.place ? `<span class="meta">${linkify(ev.place)}</span>` : ''}
        ${ev.memo ? `<span class="meta">${esc(ev.memo)}</span>` : ''}
      </div>
      <div class="ops">
        ${opts.showCountdown ? countdown(ev.date) : ''}
        ${state.readOnly ? '' : `<button class="btn small" type="button" data-action="edit-event" data-id="${esc(id)}">編集</button>
        <button class="icon-btn" type="button" data-action="delete-event" data-id="${esc(id)}" aria-label="この予定を削除" title="削除">${TRASH}</button>`}
      </div>
    </article>`;
  }

  function emptyHtml(title, body, action, label) {
    return `<div class="empty"><strong>${title}</strong><span>${body}</span>${action && !state.readOnly ? `<button class="btn primary" type="button" data-action="${action}">${label}</button>` : ''}</div>`;
  }

  /* ---------- 描画 ---------- */
  function renderStats() {
    const t = todayStr();
    const evs = [...state.events.values()];
    const todays = evs.filter(e => e.date === t && !e.done);
    const deadlines = evs.filter(e => e.kind === 'deadline' && !e.done && daysUntil(e.date) >= 0 && daysUntil(e.date) <= 7)
      .sort((a, b) => a.date.localeCompare(b.date));
    const overdue = evs.filter(e => !e.done && daysUntil(e.date) < 0);
    const cos = [...state.companies.values()];
    const active = cos.filter(c => ACTIVE.has(c.stage)).length;
    const offers = cos.filter(c => c.stage === '内定').length;
    const nextDl = deadlines[0];
    document.getElementById('stats').innerHTML = `
      <button type="button" class="stat" data-action="stat" data-go="today"><span class="label">今日の予定</span><span class="value num">${todays.length}<small>件</small></span>
        <span class="hint">${todays[0] ? esc((coName(todays[0].companyId) + ' ' + todays[0].title).trim()) : 'なし'}</span></button>
      <button type="button" class="stat${deadlines.length ? ' alert' : ''}" data-action="stat" data-go="upcoming"><span class="label">7日以内の締切</span><span class="value num">${deadlines.length}<small>件</small></span>
        <span class="hint">${nextDl ? esc(fmtShort(nextDl.date) + ' ' + (coName(nextDl.companyId) || nextDl.title)) : 'なし'}</span></button>
      <button type="button" class="stat${overdue.length ? ' alert' : ''}" data-action="stat" data-go="upcoming"><span class="label">期限切れ・未完了</span><span class="value num">${overdue.length}<small>件</small></span>
        <span class="hint">${overdue.length ? '完了チェックか日程の見直しを' : 'なし'}</span></button>
      <button type="button" class="stat" data-action="stat" data-go="companies"><span class="label">選考中の企業</span><span class="value num">${active}<small>社</small></span>
        <span class="hint">登録 ${cos.length}社</span></button>
      <button type="button" class="stat${offers ? ' good' : ''}" data-action="stat" data-go="offer"><span class="label">内定</span><span class="value num">${offers}<small>社</small></span>
        <span class="hint">${offers ? esc(cos.filter(c => c.stage === '内定').map(c => c.name).join('・')) : ' '}</span></button>`;
  }

  function renderUpcoming() {
    const el = document.getElementById('view-upcoming');
    if (state.mode === 'loading') { el.innerHTML = emptyHtml('読み込み中…', '保存された予定を読み込んでいます。'); return; }
    const all = [...state.events.entries()].sort(evSort);
    if (!all.length) {
      el.innerHTML = emptyHtml('まだ予定がありません', 'ESの締切、説明会、面接などを登録すると、日付順にここへ並びます。', 'new-event', '最初の予定を追加');
      return;
    }
    const overdue = all.filter(([, e]) => !e.done && daysUntil(e.date) < 0);
    const upcoming = all.filter(([, e]) => daysUntil(e.date) >= 0 && (state.showDone || !e.done));
    const past = state.showDone ? all.filter(([, e]) => e.done && daysUntil(e.date) < 0).reverse() : [];
    let html = `<div class="toolbar"><span class="num" style="color:var(--muted);font-size:.9rem">今後の予定 ${all.filter(([, e]) => daysUntil(e.date) >= 0 && !e.done).length}件</span>
      <label><input type="checkbox" id="show-done" data-action="show-done"${state.showDone ? ' checked' : ''}> 完了済みも表示</label></div>`;
    if (overdue.length) {
      html += `<div class="day"><h3 style="color:var(--danger)">期限が過ぎた未完了の予定</h3>${overdue.map(([id, e]) => itemHtml(id, e, { showDate: true, showCountdown: true })).join('')}</div>`;
    }
    const groups = new Map();
    for (const [id, e] of upcoming) { if (!groups.has(e.date)) groups.set(e.date, []); groups.get(e.date).push([id, e]); }
    for (const [date, items] of groups) {
      const f = fmtDay(date);
      html += `<div class="day"><h3><span class="num">${f.md}</span><span class="wd">（${f.wd}）</span>${countdown(date)}</h3>${items.map(([id, e]) => itemHtml(id, e)).join('')}</div>`;
    }
    if (!groups.size && !overdue.length) html += emptyHtml('今後の予定はありません', '新しい締切や面接が決まったら追加しましょう。', 'new-event', '予定を追加');
    if (past.length) html += `<div class="day"><h3 style="color:var(--muted)">終わった予定</h3>${past.map(([id, e]) => itemHtml(id, e, { showDate: true })).join('')}</div>`;
    el.innerHTML = html;
  }

  function renderCalendar() {
    const el = document.getElementById('view-calendar');
    const m = state.month;
    const first = new Date(m.getFullYear(), m.getMonth(), 1);
    const start = new Date(first); start.setDate(1 - first.getDay());
    const byDate = new Map();
    for (const [id, e] of [...state.events.entries()].sort(evSort)) {
      if (!state.showDone && e.done) continue;
      if (!byDate.has(e.date)) byDate.set(e.date, []);
      byDate.get(e.date).push([id, e]);
    }
    const t = todayStr();
    let cells = WD.map((w, i) => `<div class="dow${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</div>`).join('');
    const weeks = Math.ceil((first.getDay() + new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate()) / 7);
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const s = ymd(d);
      const evs = byDate.get(s) || [];
      const cls = ['cell', d.getMonth() !== m.getMonth() ? 'out' : '', d.getDay() === 0 ? 'sun' : d.getDay() === 6 ? 'sat' : '', s === t ? 'is-today' : '', s === state.selDate ? 'sel' : ''].filter(Boolean).join(' ');
      const shown = evs.slice(0, 3).map(([, e]) => `<span class="ev ${(KINDS[e.kind] || KINDS.other).cls}">${esc(coName(e.companyId) || e.title)}</span>`).join('');
      const more = evs.length > 3 ? `<span class="more">他${evs.length - 3}件</span>` : '';
      cells += `<button type="button" class="${cls}" data-action="pick-date" data-date="${s}" aria-label="${d.getMonth() + 1}月${d.getDate()}日 予定${evs.length}件"><span class="d num">${d.getDate()}</span>${shown}${more}</button>`;
    }
    const sel = byDate.get(state.selDate) || [];
    const sf = fmtDay(state.selDate);
    el.innerHTML = `
      <div class="cal-head">
        <h2 class="num">${m.getFullYear()}年${m.getMonth() + 1}月</h2>
        <button class="btn small" type="button" data-action="month" data-delta="-1" aria-label="前の月">‹ 前月</button>
        <button class="btn small" type="button" data-action="month" data-delta="0">今月</button>
        <button class="btn small" type="button" data-action="month" data-delta="1" aria-label="次の月">次月 ›</button>
        <div class="legend" style="margin-left:auto">${Object.values(KINDS).map(k => `<span class="kind ${k.cls}">${k.label}</span>`).join('')}</div>
      </div>
      <div class="cal-scroll"><div class="cal">${cells}</div></div>
      <div class="day">
        <div class="toolbar"><h3><span class="num">${sf.md}</span><span class="wd">（${sf.wd}）</span>${countdown(state.selDate)}</h3>
          ${state.readOnly ? '' : `<button class="btn small primary" type="button" data-action="new-event" data-date="${state.selDate}">この日に予定を追加</button>`}</div>
        ${sel.length ? sel.map(([id, e]) => itemHtml(id, e)).join('') : '<p class="notice">この日の予定はありません。カレンダーの日付を押すと、その日の予定が表示されます。</p>'}
      </div>`;
  }

  function nextEventFor(cid) {
    return [...state.events.entries()].filter(([, e]) => e.companyId === cid && !e.done && daysUntil(e.date) >= 0).sort(evSort)[0];
  }

  function renderCompanies() {
    const el = document.getElementById('view-companies');
    if (state.mode === 'loading') { el.innerHTML = emptyHtml('読み込み中…', '登録した企業を読み込んでいます。'); return; }
    const cos = [...state.companies.entries()];
    if (!cos.length) {
      el.innerHTML = emptyHtml('まだ企業が登録されていません', '受けている企業・気になる企業を登録すると、選考段階ごとに整理できます。', 'new-company', '最初の企業を追加');
      return;
    }
    const counts = Object.fromEntries(STAGES.map(s => [s, 0]));
    for (const [, c] of cos) counts[c.stage] = (counts[c.stage] || 0) + 1;
    let html = `<div class="pipeline" role="group" aria-label="選考段階で絞り込み">${STAGES.map(s =>
      `<button type="button" class="stage-chip${s === '内定' ? ' offer' : ''}" data-action="stage-filter" data-stage="${s}" aria-pressed="${state.stageFilter === s}"><span class="n num">${counts[s]}</span><span class="s">${s}</span></button>`).join('')}</div>`;
    if (state.stageFilter) html += `<div class="toolbar"><span style="color:var(--muted)">「${esc(state.stageFilter)}」だけを表示中</span><button class="btn small" type="button" data-action="stage-filter" data-stage="">すべて表示</button></div>`;
    const stages = state.stageFilter ? [state.stageFilter] : STAGES;
    for (const s of stages) {
      const list = cos.filter(([, c]) => c.stage === s).sort((a, b) => (b[1].priority || 2) - (a[1].priority || 2) || a[1].name.localeCompare(b[1].name, 'ja'));
      if (!list.length) continue;
      html += `<div class="stage-group"><h3>${esc(s)}<span class="pill num">${list.length}社</span></h3><div class="cards">${list.map(([id, c]) => {
        const nx = nextEventFor(id);
        const nxHtml = nx ? `<div class="next"><span class="kind ${(KINDS[nx[1].kind] || KINDS.other).cls}">${(KINDS[nx[1].kind] || KINDS.other).label}</span> <span class="num">${fmtShort(nx[1].date)}${nx[1].time ? ' ' + esc(nx[1].time) : ''}</span> ${esc(nx[1].title)} ${countdown(nx[1].date)}</div>`
          : '<div class="next none">次の予定は未登録</div>';
        return `<article class="card" data-action="view-company" data-id="${esc(id)}" tabindex="0" aria-label="${esc(c.name)} の詳細を見る">
          <div class="row"><span class="name">${esc(c.name)}</span><span class="prio prio-${c.priority || 2}">${PRIO[c.priority || 2]}</span></div>
          ${c.industry ? `<span class="ind">${esc(c.industry)}</span>` : ''}
          ${nxHtml}
          ${c.memo ? `<div class="memo">${esc(c.memo)}</div>` : ''}
          ${isUrl(c.url) ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">採用ページを開く ↗</a>` : ''}
          <div class="ops">
            <select aria-label="選考段階" data-action="set-stage" data-id="${esc(id)}"${state.readOnly ? ' disabled' : ''}>${STAGES.map(st => `<option${st === c.stage ? ' selected' : ''}>${st}</option>`).join('')}</select>
            ${state.readOnly ? '' : `<button class="btn small" type="button" data-action="new-event" data-company="${esc(id)}">予定を追加</button>
            <button class="btn small ghost" type="button" data-action="edit-company" data-id="${esc(id)}">編集</button>
            <button class="icon-btn" type="button" data-action="delete-company" data-id="${esc(id)}" aria-label="この企業を削除" title="削除" style="margin-left:auto">${TRASH}</button>`}
          </div>
        </article>`;
      }).join('')}</div></div>`;
    }
    el.innerHTML = html;
  }

  function render() {
    renderStats();
    for (const t of ['upcoming', 'calendar', 'companies']) {
      document.getElementById('view-' + t).hidden = t !== state.tab;
      document.getElementById('tab-' + t).setAttribute('aria-selected', String(t === state.tab));
    }
    document.querySelectorAll('[data-action="new-event"],[data-action="new-company"]').forEach(b => { b.hidden = state.readOnly; });
    if (state.tab === 'upcoming') renderUpcoming();
    else if (state.tab === 'calendar') renderCalendar();
    else renderCompanies();
    refreshDetail();
    $('backup').hidden = state.mode === 'loading';
    $('lbl-import').hidden = state.readOnly;
  }

  /* ---------- ダイアログ ---------- */
  const $ = id => document.getElementById(id);
  let editingEvent = null, editingCompany = null;
  let detailView = null;   // 開いている詳細 {type: 'event' | 'company', id}
  let returnTo = null;     // 編集を閉じたら戻る詳細

  $('ev-kind').innerHTML = Object.entries(KINDS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
  $('co-stage').innerHTML = STAGES.map(s => `<option>${s}</option>`).join('');

  /* 詳細表示 */
  function eventDetailHtml(id, ev) {
    const k = KINDS[ev.kind] || KINDS.other;
    const f = fmtDay(ev.date);
    const ro = state.readOnly;
    return `<div class="head">
        <div><span class="kind ${k.cls}">${k.label}</span></div>
        <h2 id="detail-title">${esc(ev.title)}</h2>
        ${ev.companyId && state.companies.has(ev.companyId)
          ? `<span class="sub"><button class="btn small ghost" type="button" data-action="view-company" data-id="${esc(ev.companyId)}">${esc(coName(ev.companyId))} の詳細 ›</button></span>` : ''}
      </div>
      <dl>
        <dt>日時</dt><dd class="num">${f.md}（${f.wd}） ${ev.time ? esc(ev.time) : (ev.kind === 'deadline' ? '終日' : '時間未定')} ${countdown(ev.date)}</dd>
        <dt>状況</dt><dd>${ev.done ? '完了' : '未完了'}</dd>
        ${ev.place ? `<dt>場所・URL</dt><dd>${linkify(ev.place)}</dd>` : ''}
        <dt>メモ</dt><dd>${ev.memo ? esc(ev.memo) : '<span style="color:var(--muted)">なし</span>'}</dd>
        ${ev.source && ev.source.subject ? `<dt>元のメール</dt><dd>${isUrl(ev.source.viewUrl) ? `<a href="${esc(ev.source.viewUrl)}" target="_blank" rel="noopener">${esc(ev.source.subject)}</a>` : esc(ev.source.subject)}${ev.source.account ? `<br><span style="color:var(--muted);font-size:.82rem">${esc(ev.source.account)}</span>` : ''}</dd>` : ''}
      </dl>
      <div class="dlg-ops">
        ${ro ? '' : `<button class="btn danger" type="button" data-action="delete-event" data-id="${esc(id)}">${TRASH} 削除</button>`}
        <div class="right" style="flex-wrap:wrap">
          <a class="btn" href="${esc(gcalUrl(ev))}" target="_blank" rel="noopener">Googleカレンダーへ</a>
          ${ro ? '' : `<button class="btn" type="button" data-action="detail-toggle-done" data-id="${esc(id)}">${ev.done ? '未完了に戻す' : '完了にする'}</button>
          <button class="btn primary" type="button" data-action="edit-event" data-id="${esc(id)}">編集</button>`}
          <button class="btn" type="button" data-action="close-detail">閉じる</button>
        </div>
      </div>`;
  }

  function companyDetailHtml(id, c) {
    const ro = state.readOnly;
    const evs = [...state.events.entries()].filter(([, e]) => e.companyId === id).sort(evSort);
    const created = c.createdAt ? new Date(c.createdAt) : null;
    return `<div class="head">
        <div><span class="prio prio-${c.priority || 2}">${PRIO[c.priority || 2]}</span></div>
        <h2 id="detail-title">${esc(c.name)}</h2>
        ${c.industry ? `<span class="sub">${esc(c.industry)}</span>` : ''}
      </div>
      <dl>
        <dt>選考段階</dt><dd><select aria-label="選考段階" data-action="set-stage" data-id="${esc(id)}"${ro ? ' disabled' : ''} class="btn small">${STAGES.map(st => `<option${st === c.stage ? ' selected' : ''}>${st}</option>`).join('')}</select></dd>
        <dt>採用ページ</dt><dd>${isUrl(c.url) ? linkify(c.url) : '<span style="color:var(--muted)">未登録</span>'}</dd>
        <dt>メモ</dt><dd>${c.memo ? esc(c.memo) : '<span style="color:var(--muted)">なし</span>'}</dd>
        ${created && !isNaN(created) ? `<dt>登録日</dt><dd class="num">${created.getFullYear()}/${created.getMonth() + 1}/${created.getDate()}</dd>` : ''}
      </dl>
      <div class="sec">
        <div class="toolbar"><h3>この企業の予定 <span class="pill num">${evs.length}件</span></h3>
          ${ro ? '' : `<button class="btn small" type="button" data-action="new-event" data-company="${esc(id)}">＋ 予定を追加</button>`}</div>
        ${evs.length ? evs.map(([eid, e]) => itemHtml(eid, e, { showDate: true, showCountdown: !e.done })).join('') : '<p class="notice">まだ予定がありません。</p>'}
      </div>
      <div class="dlg-ops">
        ${ro ? '' : `<button class="btn danger" type="button" data-action="delete-company" data-id="${esc(id)}">${TRASH} 削除</button>`}
        <div class="right">
          ${ro ? '' : `<button class="btn primary" type="button" data-action="edit-company" data-id="${esc(id)}">編集</button>`}
          <button class="btn" type="button" data-action="close-detail">閉じる</button>
        </div>
      </div>`;
  }

  function refreshDetail() {
    if (!detailView || !$('dlg-detail').open) return;
    const map = detailView.type === 'event' ? state.events : state.companies;
    const data = map.get(detailView.id);
    if (!data) { closeDetail(); return; }
    $('detail-body').innerHTML = detailView.type === 'event' ? eventDetailHtml(detailView.id, data) : companyDetailHtml(detailView.id, data);
  }

  function openDetail(type, id) {
    if (!(type === 'event' ? state.events : state.companies).has(id)) return;
    detailView = { type, id };
    if (!$('dlg-detail').open) $('dlg-detail').showModal();
    refreshDetail();
    $('dlg-detail').scrollTop = 0;
  }

  function closeDetail() {
    detailView = null;
    if ($('dlg-detail').open) $('dlg-detail').close();
  }
  $('dlg-detail').addEventListener('close', () => { detailView = null; });

  // 詳細から編集を開いたときは、編集を閉じたあと詳細に戻る
  function leaveDetailFor(fn) {
    returnTo = detailView ? { ...detailView } : null;
    closeDetail();
    fn();
  }
  for (const d of ['dlg-event', 'dlg-company']) {
    $(d).addEventListener('close', () => {
      const r = returnTo; returnTo = null;
      if (r) openDetail(r.type, r.id);
    });
  }

  /* 削除（元に戻せる） */
  async function deleteEvent(id) {
    const data = state.events.get(id);
    if (!data) return;
    if (await remove('events', id)) {
      toast('予定を削除しました', async () => { if (await put('events', id, data)) toast('元に戻しました'); });
    }
  }

  async function deleteCompany(id) {
    const c = state.companies.get(id);
    if (!c) return;
    const related = [...state.events.entries()].filter(([, e]) => e.companyId === id);
    for (const [eid] of related) await remove('events', eid);
    if (await remove('companies', id)) {
      toast(related.length ? `${c.name} と予定${related.length}件を削除しました` : `${c.name} を削除しました`, async () => {
        if (!(await put('companies', id, c))) return;
        for (const [eid, e] of related) await put('events', eid, e);
        toast('元に戻しました');
      });
    }
  }

  function openEvent(id, preset = {}) {
    editingEvent = id;
    const ev = id ? state.events.get(id) : null;
    $('ev-heading').textContent = id ? '予定を編集' : '予定を追加';
    $('ev-company').innerHTML = '<option value="">（企業なし）</option>' +
      [...state.companies.entries()].sort((a, b) => a[1].name.localeCompare(b[1].name, 'ja')).map(([cid, c]) => `<option value="${esc(cid)}">${esc(c.name)}</option>`).join('');
    $('ev-kind').value = ev?.kind || preset.kind || 'interview';
    $('ev-company').value = ev?.companyId || preset.companyId || '';
    $('ev-title').value = ev?.title || '';
    $('ev-date').value = ev?.date || preset.date || todayStr();
    $('ev-time').value = ev?.time || '';
    $('ev-place').value = ev?.place || '';
    $('ev-memo').value = ev?.memo || '';
    $('ev-done').checked = !!ev?.done;
    $('ev-delete').hidden = !id;
    $('dlg-event').showModal();
    $('ev-title').focus();
  }

  function openCompany(id) {
    editingCompany = id;
    const c = id ? state.companies.get(id) : null;
    $('co-heading').textContent = id ? '企業を編集' : '企業を追加';
    $('co-name').value = c?.name || '';
    $('co-industry').value = c?.industry || '';
    $('co-priority').value = String(c?.priority || 2);
    $('co-stage').value = c?.stage || 'エントリー済';
    $('co-url').value = c?.url || '';
    $('co-memo').value = c?.memo || '';
    $('co-delete').hidden = !id;
    $('dlg-company').showModal();
    $('co-name').focus();
  }

  $('form-event').addEventListener('submit', async e => {
    e.preventDefault();
    const id = editingEvent || newId('events');
    const prev = editingEvent ? state.events.get(editingEvent) : null;
    const data = {
      kind: $('ev-kind').value,
      companyId: $('ev-company').value,
      title: $('ev-title').value.trim(),
      date: $('ev-date').value,
      time: $('ev-time').value,
      place: $('ev-place').value.trim(),
      memo: $('ev-memo').value.trim(),
      done: $('ev-done').checked,
      ...(prev?.source ? { source: prev.source } : {}),
      createdAt: prev?.createdAt || new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    if (!data.title || !data.date) return;
    $('dlg-event').close();
    if (await put('events', id, data)) {
      toast(editingEvent ? '予定を更新しました' : '予定を追加しました');
      if (state.tab === 'calendar') { state.selDate = data.date; const d = parseDate(data.date); state.month = new Date(d.getFullYear(), d.getMonth(), 1); render(); }
    }
  });

  $('form-company').addEventListener('submit', async e => {
    e.preventDefault();
    const id = editingCompany || newId('companies');
    const prev = editingCompany ? state.companies.get(editingCompany) : null;
    const data = {
      name: $('co-name').value.trim(),
      industry: $('co-industry').value.trim(),
      priority: Number($('co-priority').value),
      stage: $('co-stage').value,
      url: $('co-url').value.trim(),
      memo: $('co-memo').value.trim(),
      createdAt: prev?.createdAt || new Date().toISOString(),
      updatedAt: new Date().toISOString(),
    };
    if (!data.name) return;
    $('dlg-company').close();
    if (await put('companies', id, data)) toast(editingCompany ? '企業情報を更新しました' : `${data.name} を追加しました`);
  });

  $('ev-delete').addEventListener('click', () => {
    if (returnTo && returnTo.type === 'event') returnTo = null;
    $('dlg-event').close();
    deleteEvent(editingEvent);
  });

  $('co-delete').addEventListener('click', () => {
    returnTo = null;
    $('dlg-company').close();
    deleteCompany(editingCompany);
  });

  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));

  /* ---------- 操作 ---------- */
  document.addEventListener('click', async e => {
    if (e.target.closest('a')) return;
    const t = e.target.closest('[data-action],[data-tab]');
    if (!t) return;
    if (t.dataset.tab) {
      state.tab = t.dataset.tab;
      try { localStorage.setItem('job-schedule-tab', state.tab); } catch (err) {}
      render(); return;
    }
    const a = t.dataset.action;
    const id = t.dataset.id;
    if (a === 'view-event') openDetail('event', id);
    else if (a === 'view-company') openDetail('company', id);
    else if (a === 'close-detail') closeDetail();
    else if (a === 'new-event') leaveDetailFor(() => openEvent(null, { date: t.dataset.date, companyId: t.dataset.company }));
    else if (a === 'new-company') openCompany(null);
    else if (a === 'edit-event') leaveDetailFor(() => openEvent(id));
    else if (a === 'edit-company') leaveDetailFor(() => openCompany(id));
    else if (a === 'delete-event') {
      if (detailView && detailView.type === 'event' && detailView.id === id) closeDetail();
      deleteEvent(id);
    } else if (a === 'delete-company') {
      if (detailView) closeDetail();
      deleteCompany(id);
    } else if (a === 'detail-toggle-done') {
      const ev = state.events.get(id);
      if (ev) await put('events', id, { ...ev, done: !ev.done, updatedAt: new Date().toISOString() });
    } else if (a === 'stat') {
      const go = t.dataset.go;
      state.tab = go === 'companies' || go === 'offer' ? 'companies' : 'upcoming';
      state.stageFilter = go === 'offer' ? '内定' : null;
      try { localStorage.setItem('job-schedule-tab', state.tab); } catch (err) {}
      render();
      $('tab-' + state.tab).scrollIntoView({ block: 'start', behavior: 'smooth' });
    }
    else if (a === 'pick-date') { state.selDate = t.dataset.date; render(); }
    else if (a === 'month') {
      const d = Number(t.dataset.delta);
      if (d === 0) { const n = new Date(); state.month = new Date(n.getFullYear(), n.getMonth(), 1); state.selDate = todayStr(); }
      else state.month = new Date(state.month.getFullYear(), state.month.getMonth() + d, 1);
      render();
    } else if (a === 'stage-filter') {
      state.stageFilter = t.dataset.stage && state.stageFilter !== t.dataset.stage ? t.dataset.stage : null;
      render();
    }
  });

  // 行やカードはキーボードの Enter / Space でも詳細を開ける
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-action="view-event"],[data-action="view-company"]')) {
      e.preventDefault();
      e.target.click();
    }
  });

  document.addEventListener('change', async e => {
    const t = e.target;
    const a = t.dataset && t.dataset.action;
    if (a === 'show-done') { state.showDone = t.checked; render(); }
    else if (a === 'toggle-done') {
      const ev = state.events.get(t.dataset.id);
      if (ev) await put('events', t.dataset.id, { ...ev, done: t.checked, updatedAt: new Date().toISOString() });
    } else if (a === 'set-stage') {
      const c = state.companies.get(t.dataset.id);
      if (c && c.stage !== t.value) {
        if (await put('companies', t.dataset.id, { ...c, stage: t.value, updatedAt: new Date().toISOString() })) toast(`${c.name}：${t.value} に更新しました`);
      }
    }
  });

  /* ---------- メールから取り込む ---------- */
  const MAIL_KEYWORDS = '面接 OR 面談 OR 説明会 OR 選考 OR 締切 OR 〆切 OR 締め切り OR 適性検査 OR Webテスト OR WEBテスト OR SPI OR 玉手箱 OR 内定 OR 内々定 OR インターン OR エントリーシート OR 日程 OR 予約 OR 合否 OR 結果 OR 座談会 OR セミナー';
  const mail = { cands: [], seenKeys: [], busy: false };

  function mailStatus(msg) { const el = $('mail-status'); el.textContent = msg || ''; el.hidden = !msg; }

  function mcpErrorText(e) {
    switch (e && e.code) {
      case 'server_not_connected': return 'Gmail がつながっていません。claude.ai の 設定 → コネクタ で Gmail を追加してください。';
      case 'needs_reauth': return 'Gmail の接続が切れています。claude.ai の 設定 → コネクタ で Gmail に再接続してください。';
      case 'selection_required': return 'Gmail のアカウントが複数つながっています。画面に出る案内から、このページで使うアカウントを選んでください。';
      case 'not_in_manifest': return 'このページでの Gmail の利用が許可されていません。ページの権限設定で Gmail を許可してください。';
      case 'blocked_by_policy': case 'approval_required': return '組織の設定により、このページから Gmail を読めません。';
      case 'server_unavailable': return 'Gmail に接続できませんでした。少し待ってからもう一度お試しください。';
      case 'tool_error': return 'Gmail の読み取りでエラーが出ました: ' + (e.message || '');
      default: return 'Gmail を読み取れませんでした。少し待ってからもう一度お試しください。';
    }
  }
  function sampleErrorText(e) {
    switch (e && e.code) {
      case 'not_granted': case 'sampling_disabled': case 'not_declared': case 'capability_disabled': case 'capability_removed':
        return 'このページで Claude にメールを読ませる許可がありません。ページの権限設定を確認してください。';
      case 'rate_limited': return 'Claude の利用上限に達しました。しばらく待ってからもう一度お試しください。';
      case 'session_expired': return 'claude.ai に再ログインしてください。';
      case 'prompt_too_large': return 'メールが長すぎて読み取れませんでした。期間を短くしてお試しください。';
      case 'refused': case 'empty_completion': case 'invalid_json': return 'メールの内容をうまく読み取れませんでした。もう一度お試しください。';
      default: return 'メールの読み取り中にエラーが出ました。少し待ってからもう一度お試しください。';
    }
  }

  // パスワードなどの行は Claude に渡す前に伏せる
  const redact = t => String(t || '').split('\n').map(l => /(パスワード|ＰＷ|\bPW\b|pass\s*word|passcode|暗証)/i.test(l) ? '[秘密情報のため省略]' : l).join('\n');
  const normCo = s => String(s || '').normalize('NFKC').replace(/株式会社|有限会社|合同会社|\(株\)|（株）|グループ|ホールディングス|\s/g, '').toLowerCase();

  function findCompany(name) {
    const n = normCo(name);
    if (!n) return null;
    for (const [id, c] of state.companies) {
      const m = normCo(c.name);
      if (m && (m === n || m.includes(n) || n.includes(m))) return id;
    }
    return null;
  }

  async function loadSeen() {
    try { const snap = await db.collection('mailSeen').get(); return new Set(snap.docs.map(d => d.id)); }
    catch (e) { return new Set(); }
  }
  async function markSeen(keys) {
    const at = new Date().toISOString();
    for (let i = 0; i < keys.length; i += 10) {
      await Promise.all(keys.slice(i, i + 10).map(k => db.collection('mailSeen').doc(k).set({ at }).catch(() => {})));
    }
  }

  // Gmail 側の失敗と Claude 側の失敗を見分けられるよう印を付ける
  async function callGmail(tool, input) {
    try { return await mcp.callTool('Gmail', tool, input); }
    catch (e) { throw { src: 'gmail', e }; }
  }

  const today = () => { const d = new Date(); return `${ymd(d)}（${WD[d.getDay()]}）`; };

  async function triage(threads, wantInvites) {
    const list = threads.map((t, i) => {
      const m = (t.messages || [])[0] || {};
      return { i, from: m.sender || '', subject: m.subject || '', snippet: String(m.snippet || '').slice(0, 220) };
    });
    const res = await sampler.json(
      `あなたは就職活動中の学生のメール整理係です。今日は ${today()}。\n` +
      `次のメール一覧から、本人の就活スケジュールに関係するものを選んでください。\n` +
      `type の付け方:\n- "confirmed": 本人が申し込んだ・選考中の企業からの連絡（説明会や面接の予約完了・日程確定・日程調整のお願い、Webテスト受検依頼、ES提出締切、選考結果、内定の連絡など）\n` +
      `- "invite": まだ申し込んでいない説明会・イベント・選考への案内や勧誘（就活サイトの一斉配信を含む）\n- "other": 就活の予定に関係ないもの\n` +
      `"other" は出力に含めないでください。JSON だけを返してください: {"keep":[{"i":番号,"type":"confirmed"|"invite"}]}\n\n` +
      JSON.stringify(list),
      { modelTier: 'quick' }
    );
    const keep = Array.isArray(res && res.keep) ? res.keep : [];
    return keep.filter(k => Number.isInteger(k.i) && threads[k.i] && (k.type === 'confirmed' || (wantInvites && k.type === 'invite')))
      .map(k => ({ thread: threads[k.i], type: k.type }));
  }

  async function extract(emails) {
    const coNames = [...state.companies.values()].map(c => c.name).slice(0, 80);
    const res = await sampler.json(
      `あなたは就職活動中の学生の予定管理係です。今日は ${today()}（日本時間）。\n` +
      `次のメールそれぞれから、カレンダーに入れるべき予定を取り出してください。\n` +
      `ルール:\n` +
      `- kind は "deadline"(提出・受検・返信の締切) / "seminar"(説明会・座談会・インターン) / "test"(Webテスト・適性検査) / "interview"(面接・面談) / "other"(選考結果の連絡など) のどれか\n` +
      `- date は "YYYY-MM-DD"。年が書かれていなければ今日以降で一番近い日付にする。日付が読み取れない予定は出さない\n` +
      `- time は "HH:MM"（24時間制・日本時間）。締切なら締切時刻。なければ ""\n` +
      `- 候補日から選ぶよう求められていて確定していない場合は、返信の締切を kind "deadline"、title "面接日程の返信" のようにする\n` +
      `- 選考結果の連絡は kind "other"、date はメールの受信日、title は「書類選考 通過」のように短く、stage に次の段階を入れる\n` +
      `- stage は次のどれか、または ""：${STAGES.join(' / ')}\n` +
      `- place はオンラインURL・会場住所・建物名など。なければ ""\n` +
      `- memo は持ち物・服装・準備など短く。ID・パスワード・URL内のトークンは絶対に書かない\n` +
      `- company は正式な企業名。登録済みの企業と同じ会社なら、その表記に合わせる: ${JSON.stringify(coNames)}\n` +
      `- confidence は "high" / "medium" / "low"\n` +
      `JSON だけを返してください: {"emails":[{"i":番号,"items":[{"company":"","kind":"","title":"","date":"","time":"","place":"","memo":"","stage":"","confidence":""}]}]}\n\n` +
      JSON.stringify(emails),
      { modelTier: 'default' }
    );
    return Array.isArray(res && res.emails) ? res.emails : [];
  }

  function cleanItem(it) {
    if (!it || typeof it !== 'object') return null;
    const date = String(it.date || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || isNaN(parseDate(date))) return null;
    const time = /^\d{2}:\d{2}$/.test(it.time || '') ? it.time : '';
    const title = String(it.title || '').trim().slice(0, 120);
    if (!title) return null;
    return {
      company: String(it.company || '').trim().slice(0, 100),
      kind: KINDS[it.kind] ? it.kind : 'other',
      title, date, time,
      place: String(it.place || '').trim().slice(0, 300),
      memo: String(it.memo || '').trim().slice(0, 1000),
      stage: STAGES.includes(it.stage) ? it.stage : '',
      confidence: ['high', 'medium', 'low'].includes(it.confidence) ? it.confidence : 'medium',
    };
  }

  function isDuplicate(c) {
    const cid = findCompany(c.company);
    for (const ev of state.events.values()) {
      if (ev.date !== c.date) continue;
      if ((ev.time || '') !== c.time && ev.time && c.time) continue;
      if (cid && ev.companyId === cid) return true;
      if (normCo(ev.title) === normCo(c.title)) return true;
    }
    return false;
  }

  function renderCands() {
    const el = $('mail-results');
    if (!mail.cands.length) { el.innerHTML = ''; $('mail-add').hidden = true; return; }
    const groups = [['confirmed', '自分の選考・予約の連絡'], ['invite', '申し込み前の案内']];
    el.innerHTML = groups.map(([type, label]) => {
      const rows = mail.cands.map((c, i) => [c, i]).filter(([c]) => c.type === type);
      if (!rows.length) return '';
      return `<div class="mail-group"><h3>${label}（${rows.length}件）</h3>${rows.map(([c, i]) => {
        const k = KINDS[c.kind] || KINDS.other;
        const cid = findCompany(c.company);
        const stageNote = c.stage ? (cid ? `選考段階を「${esc(c.stage)}」に更新` : `新しい企業として「${esc(c.stage)}」で登録`) : (c.company && !cid ? '新しい企業として登録' : '');
        return `<label class="cand">
          <input type="checkbox" data-cand="${i}"${c.checked ? ' checked' : ''}>
          <span class="body">
            <span class="top"><span class="kind ${k.cls}">${k.label}</span><span class="num">${fmtShort(c.date)}${c.time ? ' ' + esc(c.time) : ''}</span>${countdown(c.date)}${c.confidence === 'low' ? '<span class="pill">自信なし</span>' : ''}</span>
            <span class="ttl">${c.company ? esc(c.company) + '　' : ''}${esc(c.title)}</span>
            ${c.place ? `<span class="meta">${esc(c.place)}</span>` : ''}
            ${c.memo ? `<span class="meta">${esc(c.memo)}</span>` : ''}
            ${stageNote ? `<span class="meta">${stageNote}</span>` : ''}
            ${c.dup ? '<span class="warn">同じ日に登録済みの予定があります（重複かもしれません）</span>' : ''}
            <span class="src">${isUrl(c.source.viewUrl) ? `<a href="${esc(c.source.viewUrl)}" target="_blank" rel="noopener">${esc(c.source.subject || '(件名なし)')}</a>` : esc(c.source.subject || '')}${c.source.account ? ' · ' + esc(c.source.account) : ''}</span>
          </span>
        </label>`;
      }).join('')}</div>`;
    }).join('');
    $('mail-add').hidden = false;
  }

  function pushCands(results, sources) {
    for (const r of results) {
      const src = sources[r.i];
      if (!src) continue;
      for (const raw of (Array.isArray(r.items) ? r.items : [])) {
        const it = cleanItem(raw);
        if (!it) continue;
        const dup = isDuplicate(it);
        mail.cands.push({ ...it, type: src.type, source: src.source, key: src.key, dup,
          checked: src.type === 'confirmed' && !dup && it.confidence !== 'low' && daysUntil(it.date) >= -1 });
      }
    }
  }

  async function scanGmail() {
    if (mail.busy) return;
    mail.busy = true; mail.cands = []; mail.seenKeys = []; renderCands();
    $('mail-scan').disabled = true;
    try {
      const days = Number($('mail-range').value) || 7;
      const query = `newer_than:${days}d -in:sent -in:draft -in:chats (${MAIL_KEYWORDS})`;
      mailStatus('Gmail を検索しています…');
      let threads = [], pageToken = '';
      for (let page = 0; page < 2; page++) {
        const r = await callGmail('search_threads', { query, pageSize: 40, ...(pageToken ? { pageToken } : {}) });
        const p = r.payload || {};
        threads.push(...(Array.isArray(p.threads) ? p.threads : []));
        pageToken = p.nextPageToken || '';
        if (!pageToken) break;
      }
      const accounts = new Set();
      for (const t of threads) for (const m of (t.messages || [])) for (const a of (m.toRecipients || [])) if (/@/.test(a)) accounts.add(a);
      $('mail-accounts').textContent = accounts.size ? `受信アドレス: ${[...accounts].slice(0, 3).join(', ')}` : '';
      const seen = $('mail-rescan').checked ? new Set() : await loadSeen();
      const keyOf = t => `${t.id}-${t.messageCount || (t.messages || []).length}`;
      threads = threads.filter(t => t && t.id && !seen.has(keyOf(t)));
      if (!threads.length) { mailStatus(`直近${days}日に新しい就活メールはありませんでした。`); return; }

      mailStatus(`${threads.length}件のメールから、就活の予定に関係するものを選んでいます…`);
      const kept = await triage(threads, $('mail-invites').checked);
      const keptIds = new Set(kept.map(k => k.thread.id));
      // 案内も表示しているときだけ、選ばれなかったメール（予定に無関係）を次回から読まない。
      // 案内を表示していないときは、案内メールと無関係なメールを見分けられないので残す。
      const skipKeys = [];
      if ($('mail-invites').checked) for (const t of threads) if (!keptIds.has(t.id)) skipKeys.push(keyOf(t));
      if (!kept.length) { await markSeen(skipKeys); mailStatus('予定として取り込めそうなメールはありませんでした。'); return; }

      const targets = kept.slice(0, 20);
      const sources = [], emails = [];
      for (let i = 0; i < targets.length; i++) {
        mailStatus(`メールを読んでいます（${i + 1} / ${targets.length}）…`);
        const { thread, type } = targets[i];
        let msgs = [];
        try {
          const r = await callGmail('get_thread', { threadId: thread.id, messageFormat: 'PLAIN_TEXT' });
          msgs = (r.payload && r.payload.messages) || [];
        } catch (err) { if (!(err && err.src === 'gmail' && err.e && err.e.code === 'tool_error')) throw err; }
        const m = msgs[msgs.length - 1] || (thread.messages || [])[0] || {};
        sources.push({ type, key: keyOf(thread), source: { subject: String(m.subject || '').slice(0, 200), viewUrl: isUrl(m.viewUrl || thread.viewUrl) ? (m.viewUrl || thread.viewUrl) : '', account: (m.toRecipients || [])[0] || '' } });
        emails.push({ i: sources.length - 1, from: m.sender || '', subject: m.subject || '', received: m.date || '', body: redact(m.plaintext_body || m.snippet || '').slice(0, 3500) });
      }
      for (let i = 0; i < emails.length; i += 4) {
        mailStatus(`Claude が予定を取り出しています（${Math.min(i + 4, emails.length)} / ${emails.length}）…`);
        pushCands(await extract(emails.slice(i, i + 4)), sources);
        renderCands();
      }
      mail.seenKeys = [...new Set([...sources.map(s => s.key), ...skipKeys])];
      mailStatus(mail.cands.length
        ? `${mail.cands.length}件の予定が見つかりました。追加するものにチェックを入れて「選んだ予定を追加」を押してください。`
        : 'メールは読みましたが、日付のある予定は見つかりませんでした。');
      if (!mail.cands.length) await markSeen(mail.seenKeys);
    } catch (e) {
      mailStatus(e && e.src === 'gmail' ? mcpErrorText(e.e) : sampleErrorText(e));
    } finally {
      mail.busy = false; $('mail-scan').disabled = false;
    }
  }

  async function readPasted() {
    const text = $('mail-paste-text').value.trim();
    if (!text || mail.busy) return;
    mail.busy = true; mail.cands = []; mail.seenKeys = []; renderCands();
    try {
      mailStatus('Claude が予定を取り出しています…');
      const subject = (text.match(/^(?:件名|Subject)\s*[:：]\s*(.+)$/mi) || [])[1] || '貼り付けたメール';
      const sources = [{ type: 'confirmed', key: '', source: { subject: subject.slice(0, 200), viewUrl: '', account: '' } }];
      pushCands(await extract([{ i: 0, body: redact(text).slice(0, 12000) }]), sources);
      renderCands();
      mailStatus(mail.cands.length ? `${mail.cands.length}件の予定が見つかりました。` : '日付のある予定は見つかりませんでした。');
    } catch (e) { mailStatus(sampleErrorText(e)); }
    finally { mail.busy = false; }
  }

  async function addCands() {
    const chosen = mail.cands.filter(c => c.checked);
    if (!chosen.length) { mailStatus('追加する予定にチェックを入れてください。'); return; }
    $('mail-add').disabled = true;
    const created = new Map();
    let nEv = 0, nCo = 0;
    try {
      for (const c of chosen) {
        let cid = '';
        if (c.company) {
          cid = findCompany(c.company) || created.get(normCo(c.company)) || '';
          if (!cid) {
            cid = newId('companies');
            const now = new Date().toISOString();
            if (!(await put('companies', cid, { name: c.company, industry: '', priority: 2, stage: c.stage || 'エントリー済', url: '', memo: '', createdAt: now, updatedAt: now }))) return;
            created.set(normCo(c.company), cid); nCo++;
          } else if (c.stage) {
            const co = state.companies.get(cid);
            const later = c.stage === '辞退・見送り' || STAGES.indexOf(c.stage) > STAGES.indexOf(co && co.stage);
            if (co && later) await put('companies', cid, { ...co, stage: c.stage, updatedAt: new Date().toISOString() });
          }
        }
        const now = new Date().toISOString();
        if (await put('events', newId('events'), {
          kind: c.kind, companyId: cid, title: c.title, date: c.date, time: c.time, place: c.place, memo: c.memo,
          done: c.kind === 'other' && daysUntil(c.date) <= 0, source: c.source, createdAt: now, updatedAt: now,
        })) nEv++;
      }
      await markSeen(mail.seenKeys.filter(Boolean));
      mail.cands = []; renderCands();
      mailStatus('');
      $('dlg-mail').close();
      toast(`予定${nEv}件を追加しました${nCo ? `（新しい企業 ${nCo}社）` : ''}`);
    } finally { $('mail-add').disabled = false; }
  }

  $('btn-mail').addEventListener('click', () => { mailStatus(''); renderCands(); $('dlg-mail').showModal(); });
  $('mail-scan').addEventListener('click', scanGmail);
  $('mail-paste-go').addEventListener('click', readPasted);
  $('mail-add').addEventListener('click', addCands);
  $('mail-results').addEventListener('change', e => {
    const i = e.target.dataset && e.target.dataset.cand;
    if (i !== undefined && mail.cands[i]) mail.cands[i].checked = e.target.checked;
  });

  /* ---------- バックアップ ---------- */
  $('btn-export').addEventListener('click', async () => {
    const json = JSON.stringify({
      app: 'job-schedule', version: 1, exportedAt: new Date().toISOString(),
      companies: Object.fromEntries(state.companies), events: Object.fromEntries(state.events),
    }, null, 2);
    const filename = `job-schedule-backup-${todayStr()}.json`;
    if (state.mode === 'db') {
      let downloads = null;
      try { downloads = await window.claude.use('downloads'); } catch (e) {}
      if (!downloads) { toast('この画面ではファイルを保存できません'); return; }
      try { await downloads.save({ filename, data: json }); toast('バックアップを保存しました'); }
      catch (e) { if (e && e.code !== 'declined') toast('バックアップを保存できませんでした'); }
      return;
    }
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('バックアップを保存しました');
  });

  $('file-import').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    let data;
    try { data = JSON.parse(await file.text()); } catch (err) { toast('ファイルを読み込めませんでした。保存したバックアップのファイルを選んでください'); return; }
    if (!data || data.app !== 'job-schedule' || typeof data.companies !== 'object' || typeof data.events !== 'object') {
      toast('このアプリのバックアップファイルではありません'); return;
    }
    const okId = id => /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id) && id !== '.' && id !== '..';
    const cos = Object.entries(data.companies || {}).filter(([id, c]) => okId(id) && c && typeof c.name === 'string');
    const evs = Object.entries(data.events || {}).filter(([id, ev]) => okId(id) && ev && typeof ev.title === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(ev.date || ''));
    if (state.mode === 'db') {
      for (const [id, c] of cos) if (!(await put('companies', id, c))) return;
      for (const [id, ev] of evs) if (!(await put('events', id, ev))) return;
    } else {
      for (const [id, c] of cos) state.companies.set(id, c);
      for (const [id, ev] of evs) state.events.set(id, ev);
      saveLocal(); render();
    }
    toast(`企業${cos.length}社・予定${evs.length}件を読み込みました`);
  });

  let toastTimer = null;
  function toast(msg, undo) {
    const el = $('toast');
    const btn = $('toast-undo');
    $('toast-msg').textContent = msg;
    btn.hidden = !undo;
    btn.onclick = undo ? () => { el.hidden = true; clearTimeout(toastTimer); undo(); } : null;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, undo ? 6000 : 2600);
  }

  const td = new Date();
  $('today').textContent = `今日は ${td.getFullYear()}年${td.getMonth() + 1}月${td.getDate()}日（${WD[td.getDay()]}）`;
  render();
  initStore();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
